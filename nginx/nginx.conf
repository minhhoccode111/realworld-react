# SSL Certificate Setup Instructions:
#
# 1. Install certbot:
#    sudo apt update && sudo apt install certbot python3-certbot-nginx
#
# 2. Create a temporary nginx config to get certificates (HTTP-01 challenge):
#    sudo nano /etc/nginx/sites-available/temp
#
#    server {
#        listen 80;
#        server_name rw.minhhoccode111.com;
#        location / {
#            return 200 "ACME challenge ready";
#        }
#    }
#
# 3. Enable and test the temporary config:
#    sudo ln -s /etc/nginx/sites-available/temp /etc/nginx/sites-enabled/temp
#    sudo nginx -t && sudo systemctl reload nginx
#
# 4. Obtain SSL certificate:
#    sudo certbot certonly --nginx -d rw.minhhoccode111.com
#
# 5. Setup auto-renewal:
#    sudo certbot renew --dry-run
#    # Certbot automatically sets up a cron job or systemd timer
#    sudo systemctl list-timers | grep certbot
#
# 6. After obtaining certs, replace temporary config with this full config:
#    sudo rm /etc/nginx/sites-enabled/temp
#    sudo cp nginx.conf /etc/nginx/nginx.conf (or add to sites-enabled)
#    sudo nginx -t && sudo systemctl reload nginx
#
# Certificate files will be located at:
# - /etc/letsencrypt/live/rw.minhhoccode111.com/fullchain.pem
# - /etc/letsencrypt/live/rw.minhhoccode111.com/privkey.pem
#
# To test SSL configuration:
# https://www.ssllabs.com/ssltest/analyze.html?d=rw.minhhoccode111.com
#
# To renew certificates manually:
# sudo certbot renew --force-renewal
# sudo systemctl reload nginx

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    sendfile_max_chunk 1m;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30;
    open_file_cache_min_uses 2;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # Logging
    # access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Rate Limit
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    server {
        listen 80;
        server_name rw.minhhoccode111.com;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name rw.minhhoccode111.com;

        # TLS certificates
        ssl_certificate /etc/letsencrypt/live/rw.minhhoccode111.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rw.minhhoccode111.com/privkey.pem;

        # Strong TLS settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Path to your React 'dist' or 'build' folder
        root /var/www/realworld-react;
        index index.html;

        # React Router Fix: Fallback to index.html for SPA routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Static Assets Caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            etag on;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
